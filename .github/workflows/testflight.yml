name: "🚀 Сборка и Выгрузка в TestFlight"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: "Сборка iOS и Выгрузка в TestFlight"
    runs-on: macos-15

    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

    steps:
      - name: "📥 Клонирование репозитория"
        uses: actions/checkout@v4

      - name: "⚙️ Настройка Xcode"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: "💎 Установка Ruby и Fastlane через Bundler"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: "🔐 Настройка ключей App Store Connect API"
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          if [ -n "$APP_STORE_CONNECT_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
            echo "✅ Ключ авторизации App Store Connect установлен: AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          else
            echo "❌ Ошибка: Секреты App Store Connect не найдены."
            exit 1
          fi

      - name: "🛠️ Валидация файлов проекта и структуры"
        run: |
          echo "Проверка конфигураций iOS и структуры плагина..."
          ls -la
          ls -la Config/

      - name: "📦 Выгрузка в TestFlight через Fastlane"
        run: |
          bundle exec fastlane ios beta
