; --- НАСТРОЙКИ МОБИЛЬНОГО РЕНДЕРЕРА ДЛЯ СТАБИЛЬНЫХ 60 FPS НА IOS ---
r.MobileHDR=True
r.ForwardShading=True
r.MobileMSAA=4
r.Mobile.DisableVertexFog=True
r.Mobile.AllowDistanceFieldShadows=False
r.Mobile.EnableMovableLightCSMShaderCulling=True

